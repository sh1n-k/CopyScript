[project]
name = "copyscript"
version = "0.1.0"
description = "Desktop app that replaces copied YouTube URLs with transcript text."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyperclip==1.11.0",
    "youtube-transcript-api==1.2.4",
    "pyobjc-core==12.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.1; sys_platform == 'darwin'",
    "pillow>=12.2.0; sys_platform == 'win32' or sys_platform == 'linux'",
    "pystray>=0.19.5; sys_platform == 'win32' or sys_platform == 'linux'",
    "win11toast>=0.36.3; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
